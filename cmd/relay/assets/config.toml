# Shared relay-wide settings.
[server]
password = ""
# Behind a reverse proxy, CDN or tunnel (cloudflared), list the addresses it
# connects from here, or every client shares the proxy's rate limit. While
# this is empty, the relay warns at startup when ws or wss is on a private
# address, and once when it rate limits a ws or wss peer on a private address.
# A request whose TCP peer is in trusted_proxies is keyed by the address in
# client_ip_header, and no other header. X-Forwarded-For is read from the
# right, skipping trusted hops. Any other header (X-Real-IP, CF-Connecting-IP,
# ...) must hold one address that the proxy sets, replacing the client's.
trusted_proxies = []            # CIDRs allowed to supply client IP headers
# client_ip_header = "X-Forwarded-For"
# A [tls] or [wss] listener without cert_file and key_file uses a self-signed
# certificate that the relay creates once and keeps in data_dir (relay-cert.pem
# and relay-key.pem), so it survives restarts. The relay logs its SHA-256
# fingerprint at startup; clients pin that value. Removing the files makes a
# new certificate, and every client must then pin the new fingerprint.
# Empty means kamune-relay in the user's config dir (~/.config/kamune-relay).
# data_dir = "/var/lib/kamune-relay"
# Least severe level logged: debug, info, warn or error. Only debug records
# client addresses for connections that succeed and which peers registered.
# log_level = "info"

[session]
token_ttl = "10m"
session_ttl = "60m"          # max lifetime for paired sessions (0 = no limit)
handshake_timeout = "30s"    # max time for HPKE + registration (0 = 30s)
max_concurrent_sessions = 10_000
# Largest relay frame read from a client, in bytes: 65536 to 131072, or 0 for
# 65536. It limits WebSocket messages; TCP and TLS frames stop at 65535.
max_message_size = 65536

# Rate limit is ON by default. TCP, TLS and WS share one per-IP limiter, which
# keys an IPv6 client by its /64. A WS or WSS connection from a peer outside
# trusted_proxies also spends a separate per-IP connection quota with the same
# settings when it is accepted, before TLS. Every connection counts, a load
# balancer's TCP health checks on those ports included, so keep their rate
# under the quota or point them at [diagnose]. The UDP broker has two more
# limiters with the same settings, one for echo and one for REGISTER, each
# tracking up to max_entries IPs. UDP sources are not verified, so spoofed
# packets can still spend or evict an IP's broker budget, though not its TCP,
# TLS or WS one.
[rate_limit]
time_window = "1m"
quota = 20
max_entries = 100_000        # max unique IPs tracked

# Monitoring server (HTTP, /health only).
[diagnose]
enabled = false
address = "127.0.0.1:9090"

# ws and tcp carry the relay protocol without TLS, so a client cannot tell
# the relay from an impostor on the path. They listen on loopback: ws for a
# reverse proxy or tunnel on this host, tcp for local use. Expose them only on
# a network you trust, such as a LAN or VPN, and use tls or wss elsewhere.

# Plain WebSocket transport.
[ws]
enabled = false
address = "127.0.0.1:8888"

# Raw TCP transport (kamune over TCP).
[tcp]
enabled = true
address = "127.0.0.1:8889"

# Raw TLS transport (kamune over TLS).
[tls]
enabled   = true
address   = "0.0.0.0:8890"
# cert_file = "assets/cert/server.crt"
# key_file  = "assets/cert/server.key"

# WSS transport (WebSocket over TLS).
[wss]
enabled   = true
address   = "0.0.0.0:8891"
# cert_file = "assets/cert/server.crt"
# key_file  = "assets/cert/server.key"

# UDP broker (STUN-like IP echo + signal introduction for P2P hole-punching).
# Off by default. It answers unauthenticated UDP from any source, cannot sit
# behind a CDN or tunnel, so it exposes the host's address, and only helps
# clients that try direct connections. It needs a public address to work.
[broker]
enabled = false
address = "0.0.0.0:4788"
# A registration lapses registration_ttl after its last REGISTER. Clients
# refresh every 30s. A REGISTER from a new port on the held IP, as after a
# client restart, a dial retry or a NAT port change, moves the entry at once.
# One from a new IP moves it only once the held address has gone 35s without
# a refresh, whatever the TTL. So for up to about two refresh intervals after
# a client's IP changes, a peer that matches is sent the old address. That
# match consumes the entry: the peer's hole punch fails, and the client,
# whose NOTIFY went to the old address, holds a new entry only from its next
# REGISTER.
# REGISTER carries no proof of the client's key. Someone who captured one and
# shares the client's public IP, as behind the same carrier-grade NAT, can
# replay it from another port right after each of the client's refreshes and
# so hold the entry most of the time: a peer that matches then is sent the
# replayer's address.
# registration_ttl = "60s"
