# Shared relay-wide settings.
[server]
password = ""
trusted_proxies = []            # CIDRs allowed to supply client IP headers

[session]
token_ttl = "10m"
session_ttl = "60m"          # max lifetime for paired sessions (0 = no limit)
handshake_timeout = "30s"    # max time for HPKE + registration (0 = no limit)
max_concurrent_sessions = 10_000
max_message_size = 65536

# Rate limit is ON by default. TCP, TLS and WS share one per-IP limiter. The
# UDP broker has two more with the same settings, one for echo and one for
# REGISTER, each tracking up to max_entries IPs. UDP sources are not verified,
# so spoofed packets can still spend or evict an IP's broker budget, though
# not its TCP, TLS or WS one.
[rate_limit]
time_window = "1m"
quota = 20
max_entries = 100_000        # max unique IPs tracked

# Monitoring server (HTTP, /health only).
[diagnose]
enabled = false
address = "127.0.0.1:9090"

# Plain WebSocket transport (peer-facing).
[ws]
enabled = false
address = "0.0.0.0:8888"

# Raw TCP transport (kamune over TCP).
[tcp]
enabled = true
address = "0.0.0.0:8889"

# Raw TLS transport (kamune over TLS).
[tls]
enabled   = true
address   = "0.0.0.0:8890"
# cert_file = "assets/cert/server.crt"
# key_file  = "assets/cert/server.key"

# WSS transport (WebSocket over TLS).
[wss]
enabled   = true
address   = "0.0.0.0:8891"
# cert_file = "assets/cert/server.crt"
# key_file  = "assets/cert/server.key"

# UDP broker (STUN-like IP echo + signal introduction for P2P hole-punching).
[broker]
enabled = true
address = "0.0.0.0:4788"
# registration_ttl = "60s"
