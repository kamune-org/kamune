<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0883e"/>
      <stop offset="100%" stop-color="#da6d25"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d2a8ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#f0883e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#58a6ff"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#d2a8ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#7ee787"/>
    </marker>
  </defs>

  <rect width="900" height="700" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="698" rx="11" fill="none" stroke="#30363d" stroke-width="1"/>

  <text x="450" y="36" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700" letter-spacing="0.4">Kamune Protocol Overview</text>
  <text x="450" y="56" text-anchor="middle" fill="#8b949e" font-size="11">Four flights. ver 0x02. No fallback to an earlier version.</text>

  <rect x="40" y="78" width="150" height="40" rx="8" fill="#21262d" stroke="#30363d" filter="url(#shadow)"/>
  <text x="115" y="96" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Initiator</text>
  <text x="115" y="110" text-anchor="middle" fill="#8b949e" font-size="9">dialer</text>

  <rect x="710" y="78" width="150" height="40" rx="8" fill="#21262d" stroke="#30363d" filter="url(#shadow)"/>
  <text x="785" y="96" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Responder</text>
  <text x="785" y="110" text-anchor="middle" fill="#8b949e" font-size="9">listener</text>

  <line x1="115" y1="126" x2="115" y2="640" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="785" y1="126" x2="785" y2="640" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5,4"/>

  <rect x="175" y="142" width="550" height="78" rx="8" fill="#0d1117" stroke="#da6d25" stroke-width="1.2"/>
  <rect x="175" y="142" width="550" height="4" rx="2" fill="url(#gOrange)"/>
  <text x="190" y="164" fill="#f0883e" font-size="11" font-weight="700">F1  ClientHello</text>
  <text x="700" y="164" text-anchor="end" fill="#8b949e" font-size="10">clear · 1282 B</text>
  <line x1="140" y1="186" x2="760" y2="186" stroke="#f0883e" stroke-width="1.4" marker-end="url(#arrowOrange)"/>
  <text x="450" y="206" text-anchor="middle" fill="#c9d1d9" font-size="10">ver 0x02 · type 0x01 · nonce_i · tag · X-Wing pk_i</text>

  <rect x="175" y="232" width="550" height="128" rx="8" fill="#0d1117" stroke="#1f6feb" stroke-width="1.2"/>
  <rect x="175" y="232" width="550" height="4" rx="2" fill="url(#gBlue)"/>
  <text x="190" y="254" fill="#58a6ff" font-size="11" font-weight="700">F2a  ServerHello</text>
  <text x="700" y="254" text-anchor="end" fill="#8b949e" font-size="10">clear · 1154 B</text>
  <line x1="760" y1="272" x2="140" y2="272" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#arrowBlue)"/>
  <text x="450" y="290" text-anchor="middle" fill="#c9d1d9" font-size="10">ver 0x02 · type 0x02 · nonce_r · enc</text>
  <text x="190" y="316" fill="#58a6ff" font-size="11" font-weight="700">F2b  ResponderAuth</text>
  <text x="700" y="316" text-anchor="end" fill="#8b949e" font-size="10">AEAD r_hs_key · 214 B</text>
  <line x1="760" y1="334" x2="140" y2="334" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#arrowBlue)"/>
  <text x="450" y="350" text-anchor="middle" fill="#c9d1d9" font-size="10">key_R · sig_R · finished_R</text>

  <text x="450" y="384" text-anchor="middle" fill="#79c0ff" font-size="10">Initiator runs the verifier here, on the key, before it sends its name.</text>

  <rect x="175" y="398" width="550" height="92" rx="8" fill="#0d1117" stroke="#8b5cf6" stroke-width="1.2"/>
  <rect x="175" y="398" width="550" height="4" rx="2" fill="url(#gPurple)"/>
  <text x="190" y="420" fill="#d2a8ff" font-size="11" font-weight="700">F3  InitiatorAuth</text>
  <text x="700" y="420" text-anchor="end" fill="#8b949e" font-size="10">AEAD i_hs_key · 426 B</text>
  <line x1="140" y1="442" x2="760" y2="442" stroke="#d2a8ff" stroke-width="1.4" marker-end="url(#arrowPurple)"/>
  <text x="450" y="462" text-anchor="middle" fill="#c9d1d9" font-size="10">key_I · name_I · version_I · resume_sid? · binder? · sig_I · finished_I</text>
  <text x="450" y="480" text-anchor="middle" fill="#8b949e" font-size="10">Responder decides resumption, then runs its verifier.</text>

  <rect x="175" y="504" width="550" height="78" rx="8" fill="#0d1117" stroke="#238636" stroke-width="1.2"/>
  <rect x="175" y="504" width="550" height="4" rx="2" fill="url(#gGreen)"/>
  <text x="190" y="526" fill="#7ee787" font-size="11" font-weight="700">F4  Confirm</text>
  <text x="700" y="526" text-anchor="end" fill="#8b949e" font-size="10">AEAD r_hs_key · 234 B</text>
  <line x1="760" y1="546" x2="140" y2="546" stroke="#7ee787" stroke-width="1.4" marker-end="url(#arrowGreen)"/>
  <text x="450" y="566" text-anchor="middle" fill="#c9d1d9" font-size="10">status · reason · name_R · version_R · finished_C</text>

  <rect x="175" y="596" width="550" height="44" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="450" y="615" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">Session frames</text>
  <text x="450" y="630" text-anchor="middle" fill="#8b949e" font-size="10">i_ap_key and r_ap_key · first sequence is 1</text>

  <text x="450" y="674" text-anchor="middle" fill="#6e7681" font-size="10">Ed25519 · ML-KEM-768-X25519 · HKDF-SHA512 · XChaCha20-Poly1305</text>
</svg>
