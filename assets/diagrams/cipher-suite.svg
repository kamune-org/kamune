<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0883e"/>
      <stop offset="100%" stop-color="#da6d25"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d2a8ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="640" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="638" rx="11" fill="none" stroke="#30363d" stroke-width="1"/>

  <text x="450" y="36" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700" letter-spacing="0.4">Cipher Suite</text>
  <text x="450" y="58" text-anchor="middle" fill="#8b949e" font-size="12" font-family="'SF Mono','Fira Code',monospace">Ed25519_MLKEM768_HKDF-SHA512_ChaCha20-Poly1305X</text>

  <rect x="36" y="84" width="828" height="86" rx="10" fill="#0d1117" stroke="#da6d25" stroke-width="1.3" filter="url(#shadow)"/>
  <rect x="36" y="84" width="6" height="86" fill="url(#gOrange)"/>
  <text x="60" y="110" fill="#f0883e" font-size="11" font-weight="700" letter-spacing="0.8">IDENTITY</text>
  <text x="60" y="134" fill="#e6edf3" font-size="16" font-weight="700">Ed25519</text>
  <text x="200" y="128" fill="#c9d1d9" font-size="12">Signs the two handshake identities and each session frame.</text>
  <text x="200" y="148" fill="#8b949e" font-size="11">One encoding per key: 44-byte PKIX. Contexts differ per signature.</text>

  <rect x="36" y="184" width="828" height="96" rx="10" fill="#0d1117" stroke="#8b5cf6" stroke-width="1.3" filter="url(#shadow)"/>
  <rect x="36" y="184" width="6" height="96" fill="url(#gPurple)"/>
  <text x="60" y="208" fill="#d2a8ff" font-size="11" font-weight="700" letter-spacing="0.8">HELLOS</text>
  <text x="60" y="234" fill="#e6edf3" font-size="16" font-weight="700">ML-KEM-768-X25519</text>
  <text x="310" y="228" fill="#c9d1d9" font-size="12">One X-Wing key pair per handshake. HPKE export-only.</text>
  <text x="310" y="248" fill="#8b949e" font-size="11">Shared secret ss is 64 bytes: export "kamune/2 kex secret".</text>
  <text x="60" y="264" fill="#6e7681" font-size="10">Info string kamune/2 kex. HPKE does not wrap the later frames.</text>

  <rect x="36" y="294" width="828" height="86" rx="10" fill="#0d1117" stroke="#1f6feb" stroke-width="1.3" filter="url(#shadow)"/>
  <rect x="36" y="294" width="6" height="86" fill="url(#gBlue)"/>
  <text x="60" y="320" fill="#58a6ff" font-size="11" font-weight="700" letter-spacing="0.8">SCHEDULE</text>
  <text x="60" y="346" fill="#e6edf3" font-size="16" font-weight="700">HKDF-SHA512</text>
  <text x="230" y="340" fill="#c9d1d9" font-size="12">Expand-Label. The label prefix is "kamune2 ".</text>
  <text x="230" y="360" fill="#8b949e" font-size="11">Handshake, session, exporter, and resumption secrets. Hash length 64.</text>

  <rect x="36" y="394" width="828" height="96" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.3" filter="url(#shadow)"/>
  <rect x="36" y="394" width="6" height="96" fill="url(#gGreen)"/>
  <text x="60" y="418" fill="#7ee787" font-size="11" font-weight="700" letter-spacing="0.8">HANDSHAKE</text>
  <text x="60" y="444" fill="#e6edf3" font-size="16" font-weight="700">XChaCha20-Poly1305</text>
  <text x="320" y="438" fill="#c9d1d9" font-size="12">Frames 0x03, 0x04, and 0x05.</text>
  <text x="320" y="458" fill="#8b949e" font-size="11">AD is kamune/2 hs, then ver, then type.</text>
  <text x="60" y="474" fill="#6e7681" font-size="10">24-byte nonce · 32-byte key · 16-byte tag. Each key seals at most two frames.</text>

  <rect x="36" y="504" width="828" height="86" rx="10" fill="#0d1117" stroke="#238636" stroke-width="1.3" filter="url(#shadow)"/>
  <rect x="36" y="504" width="6" height="86" fill="url(#gGreen)"/>
  <text x="60" y="530" fill="#7ee787" font-size="11" font-weight="700" letter-spacing="0.8">SESSION</text>
  <text x="60" y="556" fill="#e6edf3" font-size="16" font-weight="700">XChaCha20-Poly1305</text>
  <text x="320" y="550" fill="#c9d1d9" font-size="12">Session frames after Confirm. No associated data.</text>
  <text x="320" y="570" fill="#8b949e" font-size="11">i_ap_key initiator to responder. r_ap_key the other way.</text>

  <text x="450" y="618" text-anchor="middle" fill="#6e7681" font-size="10">One suite. SPEC §3.</text>
</svg>
