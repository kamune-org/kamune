<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#7ee787"/>
    </marker>
  </defs>

  <rect width="900" height="760" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="758" rx="11" fill="none" stroke="#30363d" stroke-width="1"/>

  <text x="450" y="34" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700" letter-spacing="0.4">Message Pipeline</text>
  <text x="450" y="54" text-anchor="middle" fill="#8b949e" font-size="11">Session frames after Confirm. First sequence is 1. SPEC §6.5 and §8.</text>

  <text x="40" y="84" fill="#58a6ff" font-size="12" font-weight="700" letter-spacing="1">SEND</text>
  <text x="860" y="84" text-anchor="end" fill="#8b949e" font-size="10">outbound key: i_ap_key or r_ap_key</text>

  <rect x="28" y="98" width="110" height="78" rx="8" fill="#0d1117" stroke="#58a6ff"/>
  <text x="83" y="120" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">1</text>
  <text x="83" y="138" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">seq + 1</text>
  <text x="83" y="154" text-anchor="middle" fill="#8b949e" font-size="8">first frame is 1</text>
  <line x1="138" y1="136" x2="148" y2="136" stroke="#58a6ff" marker-end="url(#arrowBlue)"/>

  <rect x="152" y="98" width="110" height="78" rx="8" fill="#0d1117" stroke="#58a6ff"/>
  <text x="207" y="120" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">2</text>
  <text x="207" y="138" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">Data</text>
  <text x="207" y="154" text-anchor="middle" fill="#8b949e" font-size="8">serialize</text>
  <line x1="262" y1="136" x2="272" y2="136" stroke="#58a6ff" marker-end="url(#arrowBlue)"/>

  <rect x="276" y="98" width="110" height="78" rx="8" fill="#0d1117" stroke="#58a6ff"/>
  <text x="331" y="120" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">3</text>
  <text x="331" y="138" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">Metadata</text>
  <text x="331" y="154" text-anchor="middle" fill="#8b949e" font-size="8">serialize once</text>
  <line x1="386" y1="136" x2="396" y2="136" stroke="#58a6ff" marker-end="url(#arrowBlue)"/>

  <rect x="400" y="98" width="110" height="78" rx="8" fill="#0d1117" stroke="#d2a8ff"/>
  <text x="455" y="120" text-anchor="middle" fill="#d2a8ff" font-size="12" font-weight="700">4</text>
  <text x="455" y="138" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">Sign</text>
  <text x="455" y="154" text-anchor="middle" fill="#8b949e" font-size="8">Ed25519</text>
  <line x1="510" y1="136" x2="520" y2="136" stroke="#58a6ff" marker-end="url(#arrowBlue)"/>

  <rect x="524" y="98" width="110" height="78" rx="8" fill="#0d1117" stroke="#58a6ff"/>
  <text x="579" y="120" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">5</text>
  <text x="579" y="138" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">Envelope</text>
  <text x="579" y="154" text-anchor="middle" fill="#8b949e" font-size="8">+ padding</text>
  <line x1="634" y1="136" x2="644" y2="136" stroke="#58a6ff" marker-end="url(#arrowBlue)"/>

  <rect x="648" y="98" width="110" height="78" rx="8" fill="#0d1117" stroke="#7ee787"/>
  <text x="703" y="120" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700">6</text>
  <text x="703" y="138" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">Encrypt</text>
  <text x="703" y="154" text-anchor="middle" fill="#8b949e" font-size="8">no AD</text>
  <line x1="758" y1="136" x2="768" y2="136" stroke="#58a6ff" marker-end="url(#arrowBlue)"/>

  <rect x="772" y="98" width="100" height="78" rx="8" fill="#0d1117" stroke="#58a6ff"/>
  <text x="822" y="120" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">7</text>
  <text x="822" y="138" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">Write</text>
  <text x="822" y="154" text-anchor="middle" fill="#8b949e" font-size="8">2-byte length</text>

  <text x="40" y="198" fill="#6e7681" font-size="10">Sign step covers kamune/transport-sign/v1 || varint(len(Metadata)) || Metadata || Data. Fresh 24-byte nonce. 16-byte tag.</text>

  <rect x="40" y="216" width="820" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="238" text-anchor="middle" fill="#8b949e" font-size="11">Length-prefixed ciphertext on the wire</text>

  <text x="40" y="280" fill="#7ee787" font-size="12" font-weight="700" letter-spacing="1">RECEIVE</text>
  <text x="860" y="280" text-anchor="end" fill="#8b949e" font-size="10">inbound key is the peer's outbound key</text>

  <rect x="28" y="294" width="110" height="72" rx="8" fill="#0d1117" stroke="#7ee787"/>
  <text x="83" y="316" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700">1</text>
  <text x="83" y="334" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">Read</text>
  <text x="83" y="350" text-anchor="middle" fill="#8b949e" font-size="8">full frame</text>
  <line x1="138" y1="330" x2="148" y2="330" stroke="#7ee787" marker-end="url(#arrowGreen)"/>

  <rect x="152" y="294" width="110" height="72" rx="8" fill="#0d1117" stroke="#f85149"/>
  <text x="207" y="316" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700">2</text>
  <text x="207" y="334" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">Decrypt</text>
  <text x="207" y="350" text-anchor="middle" fill="#f85149" font-size="8">fail: keep</text>
  <line x1="262" y1="330" x2="272" y2="330" stroke="#7ee787" marker-end="url(#arrowGreen)"/>

  <rect x="276" y="294" width="110" height="72" rx="8" fill="#0d1117" stroke="#7ee787"/>
  <text x="331" y="316" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700">3</text>
  <text x="331" y="334" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">Unmarshal</text>
  <text x="331" y="350" text-anchor="middle" fill="#8b949e" font-size="8">SignedTransport</text>
  <line x1="386" y1="330" x2="396" y2="330" stroke="#7ee787" marker-end="url(#arrowGreen)"/>

  <rect x="400" y="294" width="110" height="72" rx="8" fill="#0d1117" stroke="#f85149"/>
  <text x="455" y="316" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700">4</text>
  <text x="455" y="334" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">Verify sig</text>
  <text x="455" y="350" text-anchor="middle" fill="#f85149" font-size="8">fail: delete</text>
  <line x1="510" y1="330" x2="520" y2="330" stroke="#7ee787" marker-end="url(#arrowGreen)"/>

  <rect x="524" y="294" width="110" height="72" rx="8" fill="#0d1117" stroke="#f85149"/>
  <text x="579" y="316" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700">5</text>
  <text x="579" y="334" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">seq == n+1</text>
  <text x="579" y="350" text-anchor="middle" fill="#f85149" font-size="8">else: keep</text>
  <line x1="634" y1="330" x2="644" y2="330" stroke="#7ee787" marker-end="url(#arrowGreen)"/>

  <rect x="648" y="294" width="110" height="72" rx="8" fill="#0d1117" stroke="#f85149"/>
  <text x="703" y="316" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700">6</text>
  <text x="703" y="334" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">Route</text>
  <text x="703" y="350" text-anchor="middle" fill="#f85149" font-size="8">bad: delete</text>
  <line x1="758" y1="330" x2="768" y2="330" stroke="#7ee787" marker-end="url(#arrowGreen)"/>

  <rect x="772" y="294" width="100" height="72" rx="8" fill="#0d1117" stroke="#7ee787"/>
  <text x="822" y="316" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700">7</text>
  <text x="822" y="334" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">Deliver</text>
  <text x="822" y="350" text-anchor="middle" fill="#8b949e" font-size="8">to the app</text>

  <rect x="40" y="384" width="400" height="64" rx="8" fill="#21262d" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="56" y="408" fill="#f85149" font-size="11" font-weight="700">End, keep, touch</text>
  <text x="56" y="428" fill="#c9d1d9" font-size="11">AEAD failure, duplicate sequence, or a gap.</text>

  <rect x="460" y="384" width="400" height="64" rx="8" fill="#21262d" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="476" y="408" fill="#f85149" font-size="11" font-weight="700">End and delete</text>
  <text x="476" y="428" fill="#c9d1d9" font-size="11">Bad signature, or a route that is not allowed.</text>

  <text x="40" y="472" fill="#8b949e" font-size="11">Decode Metadata only after the signature verifies. The key is the identity from this handshake.</text>
  <text x="40" y="492" fill="#6e7681" font-size="10">Keep means resumption state stays. Touch updates the idle window. SPEC §6.6.</text>

  <text x="40" y="530" fill="#e6edf3" font-size="12" font-weight="700">Three integrity layers</text>
  <rect x="40" y="544" width="250" height="64" rx="8" fill="#0d1117" stroke="#7ee787"/>
  <text x="56" y="568" fill="#7ee787" font-size="12" font-weight="700">Poly1305</text>
  <text x="56" y="588" fill="#8b949e" font-size="10">AEAD tag on the ciphertext</text>
  <rect x="310" y="544" width="270" height="64" rx="8" fill="#0d1117" stroke="#d2a8ff"/>
  <text x="326" y="568" fill="#d2a8ff" font-size="12" font-weight="700">Ed25519</text>
  <text x="326" y="588" fill="#8b949e" font-size="10">kamune/transport-sign/v1</text>
  <rect x="600" y="544" width="260" height="64" rx="8" fill="#0d1117" stroke="#58a6ff"/>
  <text x="616" y="568" fill="#58a6ff" font-size="12" font-weight="700">Sequence</text>
  <text x="616" y="588" fill="#8b949e" font-size="10">strict +1, per direction</text>

  <text x="450" y="660" text-anchor="middle" fill="#6e7681" font-size="10">A path that drops, replays, or corrupts a frame does not delete resumption state.</text>
  <text x="450" y="682" text-anchor="middle" fill="#6e7681" font-size="10">Local close, a valid close frame, a bad inner signature, or a bad route does.</text>
  <rect x="40" y="706" width="820" height="32" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="450" y="726" text-anchor="middle" fill="#8b949e" font-size="11">Nonce is random per encryption. Session frames use no associated data.</text>
</svg>
