<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <polygon points="0 0, 8 0, 4 8" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <polygon points="0 0, 8 0, 4 8" fill="#7ee787"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <polygon points="0 0, 8 0, 4 8" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="900" height="640" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="638" rx="11" fill="none" stroke="#30363d" stroke-width="1"/>

  <text x="450" y="36" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700" letter-spacing="0.4">Handshake States</text>
  <text x="450" y="56" text-anchor="middle" fill="#8b949e" font-size="11">Same four flights on a cold handshake and on resumption. SPEC §6, §10.</text>

  <text x="230" y="88" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700" letter-spacing="1">INITIATOR</text>
  <text x="670" y="88" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700" letter-spacing="1">RESPONDER</text>

  <rect x="70" y="104" width="250" height="44" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="195" y="123" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">I_START</text>
  <text x="195" y="138" text-anchor="middle" fill="#8b949e" font-size="9">resume lock if offering</text>
  <line x1="195" y1="148" x2="195" y2="168" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <text x="204" y="164" fill="#8b949e" font-size="9">ClientHello</text>

  <rect x="70" y="172" width="250" height="44" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="195" y="191" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">I_WAIT_SH</text>
  <text x="195" y="206" text-anchor="middle" fill="#8b949e" font-size="9">wait for ServerHello</text>
  <line x1="195" y1="216" x2="195" y2="236" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <text x="204" y="232" fill="#8b949e" font-size="9">decapsulate, derive hs keys</text>

  <rect x="70" y="240" width="250" height="44" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="195" y="259" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">I_WAIT_RA</text>
  <text x="195" y="274" text-anchor="middle" fill="#8b949e" font-size="9">wait for ResponderAuth</text>
  <line x1="195" y1="284" x2="195" y2="304" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <text x="204" y="300" fill="#8b949e" font-size="9">verifier, then InitiatorAuth</text>

  <rect x="70" y="308" width="250" height="44" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="195" y="327" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">I_WAIT_CONFIRM</text>
  <text x="195" y="342" text-anchor="middle" fill="#8b949e" font-size="9">wait for Confirm</text>
  <line x1="195" y1="352" x2="195" y2="372" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <text x="204" y="368" fill="#8b949e" font-size="9">Confirm, derive app keys</text>

  <rect x="70" y="376" width="250" height="44" rx="8" fill="#0d1117" stroke="#7ee787" stroke-width="1.8"/>
  <text x="195" y="395" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700">I_ESTABLISHED</text>
  <text x="195" y="410" text-anchor="middle" fill="#8b949e" font-size="9">session keys, lock released</text>
  <line x1="195" y1="420" x2="195" y2="440" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arrowGray)"/>
  <text x="204" y="436" fill="#8b949e" font-size="9">close</text>

  <rect x="70" y="444" width="250" height="36" rx="8" fill="#0d1117" stroke="#484f58" stroke-width="1.4"/>
  <text x="195" y="466" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="700">Closed</text>

  <rect x="520" y="104" width="250" height="44" rx="8" fill="#0d1117" stroke="#7ee787" stroke-width="1.6"/>
  <text x="645" y="123" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700">R_START</text>
  <text x="645" y="138" text-anchor="middle" fill="#8b949e" font-size="9">admission stage: waiting</text>
  <line x1="645" y1="148" x2="645" y2="176" stroke="#7ee787" stroke-width="1.3" marker-end="url(#arrowGreen)"/>
  <text x="654" y="168" fill="#8b949e" font-size="9">F2: ServerHello, ResponderAuth</text>

  <rect x="520" y="180" width="250" height="52" rx="8" fill="#0d1117" stroke="#7ee787" stroke-width="1.4"/>
  <text x="645" y="202" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">R_WAIT_IA</text>
  <text x="645" y="218" text-anchor="middle" fill="#8b949e" font-size="9">hello, then authenticated</text>
  <line x1="645" y1="232" x2="645" y2="260" stroke="#7ee787" stroke-width="1.3" marker-end="url(#arrowGreen)"/>
  <text x="654" y="252" fill="#8b949e" font-size="9">InitiatorAuth, verifier, Confirm</text>

  <rect x="520" y="264" width="250" height="44" rx="8" fill="#0d1117" stroke="#7ee787" stroke-width="1.8"/>
  <text x="645" y="283" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700">R_ESTABLISHED</text>
  <text x="645" y="298" text-anchor="middle" fill="#8b949e" font-size="9">transport handed to handler</text>
  <line x1="645" y1="308" x2="645" y2="336" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arrowGray)"/>
  <text x="654" y="328" fill="#8b949e" font-size="9">close</text>

  <rect x="520" y="340" width="250" height="36" rx="8" fill="#0d1117" stroke="#484f58" stroke-width="1.4"/>
  <text x="645" y="362" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="700">Closed</text>

  <rect x="490" y="400" width="370" height="78" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="506" y="422" fill="#8b949e" font-size="10">Hello stage starts on a valid ClientHello,</text>
  <text x="506" y="438" fill="#8b949e" font-size="10">before encapsulation. Authenticated starts</text>
  <text x="506" y="454" fill="#8b949e" font-size="10">when sig_I and finished_I verify.</text>

  <text x="450" y="520" text-anchor="middle" fill="#8b949e" font-size="11">Any error closes the connection.</text>
  <text x="450" y="542" text-anchor="middle" fill="#6e7681" font-size="10">A resume offer does not skip a flight. Both sides still run the verifier once.</text>
  <rect x="36" y="568" width="828" height="44" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="52" y="586" fill="#58a6ff" font-size="10">Initiator edge</text>
  <text x="160" y="586" fill="#8b949e" font-size="10">ClientHello, decapsulate, verifier, Confirm, close</text>
  <text x="52" y="602" fill="#7ee787" font-size="10">Responder edge</text>
  <text x="170" y="602" fill="#8b949e" font-size="10">send F2, InitiatorAuth then verifier then Confirm, close</text>
</svg>
