<svg class="kamune-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
<style>
  .kamune-diagram {
    color-scheme: dark;
    --km-canvas-0: var(--km-canvas-0-override, var(--km-canvas-0-auto, #0d1117));
    --km-canvas-1: var(--km-canvas-1-override, var(--km-canvas-1-auto, #161b22));
    --km-card: var(--km-card-override, var(--km-card-auto, #0d1117));
    --km-band: var(--km-band-override, var(--km-band-auto, #161b22));
    --km-inset: var(--km-inset-override, var(--km-inset-auto, #21262d));
    --km-border: var(--km-border-override, var(--km-border-auto, #30363d));
    --km-shadow: var(--km-shadow-override, var(--km-shadow-auto, #000));
    --km-title: var(--km-title-override, var(--km-title-auto, #e6edf3));
    --km-body: var(--km-body-override, var(--km-body-auto, #c9d1d9));
    --km-muted: var(--km-muted-override, var(--km-muted-auto, #8b949e));
    --km-faint: var(--km-faint-override, var(--km-faint-auto, #6e7681));
    --km-dim: var(--km-dim-override, var(--km-dim-auto, #484f58));
    --km-info: var(--km-info-override, var(--km-info-auto, #79c0ff));
    --km-orange: var(--km-orange-override, var(--km-orange-auto, #f0883e));
    --km-orange-2: var(--km-orange-2-override, var(--km-orange-2-auto, #da6d25));
    --km-blue: var(--km-blue-override, var(--km-blue-auto, #58a6ff));
    --km-blue-2: var(--km-blue-2-override, var(--km-blue-2-auto, #1f6feb));
    --km-purple: var(--km-purple-override, var(--km-purple-auto, #d2a8ff));
    --km-purple-2: var(--km-purple-2-override, var(--km-purple-2-auto, #8b5cf6));
    --km-purple-3: var(--km-purple-3-override, var(--km-purple-3-auto, #a371f7));
    --km-green: var(--km-green-override, var(--km-green-auto, #7ee787));
    --km-green-2: var(--km-green-2-override, var(--km-green-2-auto, #238636));
    --km-green-3: var(--km-green-3-override, var(--km-green-3-auto, #3fb950));
    --km-yellow: var(--km-yellow-override, var(--km-yellow-auto, #e3b341));
    --km-yellow-2: var(--km-yellow-2-override, var(--km-yellow-2-auto, #9e6a03));
    --km-yellow-3: var(--km-yellow-3-override, var(--km-yellow-3-auto, #d29922));
    --km-red: var(--km-red-override, var(--km-red-auto, #f85149));
    --km-red-2: var(--km-red-2-override, var(--km-red-2-auto, #da3633));
    --km-pink: var(--km-pink-override, var(--km-pink-auto, #f778ba));
    --km-pink-2: var(--km-pink-2-override, var(--km-pink-2-auto, #db61a2));
    --km-teal: var(--km-teal-override, var(--km-teal-auto, #56d4dd));
    --km-teal-2: var(--km-teal-2-override, var(--km-teal-2-auto, #1b7c83));
  }
  @media (prefers-color-scheme: light) {
    .kamune-diagram {
      color-scheme: light;
      --km-canvas-0-auto: #f6f8fa;
      --km-canvas-1-auto: #ffffff;
      --km-card-auto: #ffffff;
      --km-band-auto: #eef2f6;
      --km-inset-auto: #f6f8fa;
      --km-border-auto: #d0d7de;
      --km-shadow-auto: #1f2328;
      --km-title-auto: #1f2328;
      --km-body-auto: #59636e;
      --km-muted-auto: #656d76;
      --km-faint-auto: #6e7781;
      --km-dim-auto: #818b98;
      --km-info-auto: #0969da;
      --km-orange-auto: #bc4c00;
      --km-orange-2-auto: #9a3e00;
      --km-blue-auto: #0969da;
      --km-blue-2-auto: #0550ae;
      --km-purple-auto: #8250df;
      --km-purple-2-auto: #6639ba;
      --km-purple-3-auto: #8250df;
      --km-green-auto: #1a7f37;
      --km-green-2-auto: #116329;
      --km-green-3-auto: #1a7f37;
      --km-yellow-auto: #9a6700;
      --km-yellow-2-auto: #7d4e00;
      --km-yellow-3-auto: #9a6700;
      --km-red-auto: #d1242f;
      --km-red-2-auto: #a40e26;
      --km-pink-auto: #bf3989;
      --km-pink-2-auto: #99286e;
      --km-teal-auto: #0e7c86;
      --km-teal-2-auto: #115e67;
    }
  }
</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--km-canvas-0, #0d1117)"/>
      <stop offset="100%" stop-color="var(--km-canvas-1, #161b22)"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--km-blue, #58a6ff)"/>
      <stop offset="100%" stop-color="var(--km-blue-2, #1f6feb)"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--km-green, #7ee787)"/>
      <stop offset="100%" stop-color="var(--km-green-2, #238636)"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <polygon points="0 0, 8 0, 4 8" fill="var(--km-blue, #58a6ff)"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <polygon points="0 0, 8 0, 4 8" fill="var(--km-green, #7ee787)"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <polygon points="0 0, 8 0, 4 8" fill="var(--km-muted, #8b949e)"/>
    </marker>
  </defs>

  <rect width="900" height="640" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="638" rx="11" fill="none" stroke="var(--km-border, #30363d)" stroke-width="1"/>

  <text x="450" y="36" text-anchor="middle" fill="var(--km-title, #e6edf3)" font-size="20" font-weight="700" letter-spacing="0.4">Handshake States</text>
  <text x="450" y="56" text-anchor="middle" fill="var(--km-muted, #8b949e)" font-size="11">Same four flights on a cold handshake and on resumption. SPEC §6, §10.</text>

  <text x="230" y="88" text-anchor="middle" fill="var(--km-blue, #58a6ff)" font-size="12" font-weight="700" letter-spacing="1">INITIATOR</text>
  <text x="670" y="88" text-anchor="middle" fill="var(--km-green, #7ee787)" font-size="12" font-weight="700" letter-spacing="1">RESPONDER</text>

  <rect x="70" y="104" width="250" height="44" rx="8" fill="var(--km-card, #0d1117)" stroke="var(--km-blue, #58a6ff)" stroke-width="1.6"/>
  <text x="195" y="123" text-anchor="middle" fill="var(--km-blue, #58a6ff)" font-size="12" font-weight="700">I_START</text>
  <text x="195" y="138" text-anchor="middle" fill="var(--km-muted, #8b949e)" font-size="9">resume lock if offering</text>
  <line x1="195" y1="148" x2="195" y2="168" stroke="var(--km-blue, #58a6ff)" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <text x="204" y="164" fill="var(--km-muted, #8b949e)" font-size="9">ClientHello</text>

  <rect x="70" y="172" width="250" height="44" rx="8" fill="var(--km-card, #0d1117)" stroke="var(--km-blue, #58a6ff)" stroke-width="1.4"/>
  <text x="195" y="191" text-anchor="middle" fill="var(--km-title, #e6edf3)" font-size="12" font-weight="700">I_WAIT_SH</text>
  <text x="195" y="206" text-anchor="middle" fill="var(--km-muted, #8b949e)" font-size="9">wait for ServerHello</text>
  <line x1="195" y1="216" x2="195" y2="236" stroke="var(--km-blue, #58a6ff)" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <text x="204" y="232" fill="var(--km-muted, #8b949e)" font-size="9">decapsulate, derive hs keys</text>

  <rect x="70" y="240" width="250" height="44" rx="8" fill="var(--km-card, #0d1117)" stroke="var(--km-blue, #58a6ff)" stroke-width="1.4"/>
  <text x="195" y="259" text-anchor="middle" fill="var(--km-title, #e6edf3)" font-size="12" font-weight="700">I_WAIT_RA</text>
  <text x="195" y="274" text-anchor="middle" fill="var(--km-muted, #8b949e)" font-size="9">wait for ResponderAuth</text>
  <line x1="195" y1="284" x2="195" y2="304" stroke="var(--km-blue, #58a6ff)" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <text x="204" y="300" fill="var(--km-muted, #8b949e)" font-size="9">verifier, then InitiatorAuth</text>

  <rect x="70" y="308" width="250" height="44" rx="8" fill="var(--km-card, #0d1117)" stroke="var(--km-blue, #58a6ff)" stroke-width="1.4"/>
  <text x="195" y="327" text-anchor="middle" fill="var(--km-title, #e6edf3)" font-size="12" font-weight="700">I_WAIT_CONFIRM</text>
  <text x="195" y="342" text-anchor="middle" fill="var(--km-muted, #8b949e)" font-size="9">wait for Confirm</text>
  <line x1="195" y1="352" x2="195" y2="372" stroke="var(--km-blue, #58a6ff)" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <text x="204" y="368" fill="var(--km-muted, #8b949e)" font-size="9">Confirm, derive app keys</text>

  <rect x="70" y="376" width="250" height="44" rx="8" fill="var(--km-card, #0d1117)" stroke="var(--km-green, #7ee787)" stroke-width="1.8"/>
  <text x="195" y="395" text-anchor="middle" fill="var(--km-green, #7ee787)" font-size="12" font-weight="700">I_ESTABLISHED</text>
  <text x="195" y="410" text-anchor="middle" fill="var(--km-muted, #8b949e)" font-size="9">session keys, lock released</text>
  <line x1="195" y1="420" x2="195" y2="440" stroke="var(--km-muted, #8b949e)" stroke-width="1.3" marker-end="url(#arrowGray)"/>
  <text x="204" y="436" fill="var(--km-muted, #8b949e)" font-size="9">close</text>

  <rect x="70" y="444" width="250" height="36" rx="8" fill="var(--km-card, #0d1117)" stroke="var(--km-dim, #484f58)" stroke-width="1.4"/>
  <text x="195" y="466" text-anchor="middle" fill="var(--km-muted, #8b949e)" font-size="12" font-weight="700">Closed</text>

  <rect x="520" y="104" width="250" height="44" rx="8" fill="var(--km-card, #0d1117)" stroke="var(--km-green, #7ee787)" stroke-width="1.6"/>
  <text x="645" y="123" text-anchor="middle" fill="var(--km-green, #7ee787)" font-size="12" font-weight="700">R_START</text>
  <text x="645" y="138" text-anchor="middle" fill="var(--km-muted, #8b949e)" font-size="9">admission stage: waiting</text>
  <line x1="645" y1="148" x2="645" y2="176" stroke="var(--km-green, #7ee787)" stroke-width="1.3" marker-end="url(#arrowGreen)"/>
  <text x="654" y="168" fill="var(--km-muted, #8b949e)" font-size="9">F2: ServerHello, ResponderAuth</text>

  <rect x="520" y="180" width="250" height="52" rx="8" fill="var(--km-card, #0d1117)" stroke="var(--km-green, #7ee787)" stroke-width="1.4"/>
  <text x="645" y="202" text-anchor="middle" fill="var(--km-title, #e6edf3)" font-size="12" font-weight="700">R_WAIT_IA</text>
  <text x="645" y="218" text-anchor="middle" fill="var(--km-muted, #8b949e)" font-size="9">hello, then authenticated</text>
  <line x1="645" y1="232" x2="645" y2="260" stroke="var(--km-green, #7ee787)" stroke-width="1.3" marker-end="url(#arrowGreen)"/>
  <text x="654" y="252" fill="var(--km-muted, #8b949e)" font-size="9">InitiatorAuth, verifier, Confirm</text>

  <rect x="520" y="264" width="250" height="44" rx="8" fill="var(--km-card, #0d1117)" stroke="var(--km-green, #7ee787)" stroke-width="1.8"/>
  <text x="645" y="283" text-anchor="middle" fill="var(--km-green, #7ee787)" font-size="12" font-weight="700">R_ESTABLISHED</text>
  <text x="645" y="298" text-anchor="middle" fill="var(--km-muted, #8b949e)" font-size="9">transport handed to handler</text>
  <line x1="645" y1="308" x2="645" y2="336" stroke="var(--km-muted, #8b949e)" stroke-width="1.3" marker-end="url(#arrowGray)"/>
  <text x="654" y="328" fill="var(--km-muted, #8b949e)" font-size="9">close</text>

  <rect x="520" y="340" width="250" height="36" rx="8" fill="var(--km-card, #0d1117)" stroke="var(--km-dim, #484f58)" stroke-width="1.4"/>
  <text x="645" y="362" text-anchor="middle" fill="var(--km-muted, #8b949e)" font-size="12" font-weight="700">Closed</text>

  <rect x="490" y="400" width="370" height="78" rx="8" fill="var(--km-band, #161b22)" stroke="var(--km-border, #30363d)"/>
  <text x="506" y="422" fill="var(--km-muted, #8b949e)" font-size="10">Hello stage starts on a valid ClientHello,</text>
  <text x="506" y="438" fill="var(--km-muted, #8b949e)" font-size="10">before encapsulation. Authenticated starts</text>
  <text x="506" y="454" fill="var(--km-muted, #8b949e)" font-size="10">when sig_I and finished_I verify.</text>

  <text x="450" y="520" text-anchor="middle" fill="var(--km-muted, #8b949e)" font-size="11">Any error closes the connection.</text>
  <text x="450" y="542" text-anchor="middle" fill="var(--km-faint, #6e7681)" font-size="10">A resume offer does not skip a flight. Both sides still run the verifier once.</text>
  <rect x="36" y="568" width="828" height="44" rx="8" fill="var(--km-inset, #21262d)" stroke="var(--km-border, #30363d)"/>
  <text x="52" y="586" fill="var(--km-blue, #58a6ff)" font-size="10">Initiator edge</text>
  <text x="160" y="586" fill="var(--km-muted, #8b949e)" font-size="10">ClientHello, decapsulate, verifier, Confirm, close</text>
  <text x="52" y="602" fill="var(--km-green, #7ee787)" font-size="10">Responder edge</text>
  <text x="170" y="602" fill="var(--km-muted, #8b949e)" font-size="10">send F2, InitiatorAuth then verifier then Confirm, close</text>
</svg>
