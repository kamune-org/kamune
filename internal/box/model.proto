syntax = "proto3";
package box;

import "google/protobuf/timestamp.proto";

option go_package = "./pb";

message Introduce {
  string Name = 1;
  bytes PublicKey = 2;
  string AppVersion = 3;
}

message Handshake {
  bytes Key = 1;
  bytes Salt = 2;
  string SessionKey = 3;
}

message Peer {
  string Name = 1;
  bytes PublicKey = 2;
  google.protobuf.Timestamp FirstSeen = 3;
  google.protobuf.Timestamp LastSeen = 4;
  string AppVersion = 5;
}

message ResumeRequest {
  string SessionID = 1;
  bytes Token = 2;
}

message ResumeAccept {
  bool Accepted = 1;
  string Reason = 2;
}

message SessionData {
  map<string, bytes> Fields = 1;
}

// ResumptionState is the per-role resumption row stored on disk.
// It is not a handshake message.
message ResumptionState {
  uint64 Generation = 1;
  bytes Current = 2;
  bytes Previous = 3;
  bytes PeerPublicKey = 4;
  int64 ColdAtUnixNano = 5;
  int64 RefreshedAtUnixNano = 6;
  ResumeRole Role = 7;
}

enum ResumeRole {
  RESUME_ROLE_INVALID = 0;
  RESUME_ROLE_INITIATOR = 1;
  RESUME_ROLE_RESPONDER = 2;
}
