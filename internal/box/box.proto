syntax = "proto3";
package box;

import "google/protobuf/timestamp.proto";

option go_package = "./pb";

message SignedTransport {
  bytes Data = 1;
  bytes Signature = 2;
  bytes Metadata = 3;
  bytes Padding = 4;
}

message Metadata {
  string ID = 1;
  google.protobuf.Timestamp Timestamp = 2;
  uint64 Sequence = 3;
  Route Route = 4;
}

enum Route {
  ROUTE_INVALID = 0;
  reserved 1 to 6, 11, 12;
  reserved "ROUTE_IDENTITY", "ROUTE_REQUEST_HANDSHAKE",
      "ROUTE_ACCEPT_HANDSHAKE", "ROUTE_FINALIZE_HANDSHAKE",
      "ROUTE_SEND_CHALLENGE", "ROUTE_VERIFY_CHALLENGE",
      "ROUTE_RESUME_REQUEST", "ROUTE_RESUME_ACCEPT";
  ROUTE_EXCHANGE_MESSAGES = 7;
  ROUTE_CLOSE_TRANSPORT = 8;
  ROUTE_PING = 9;
  ROUTE_PONG = 10;
  ROUTE_SESSION_DATA = 13;
}
